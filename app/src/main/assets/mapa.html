<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body, #map {
        height: 100%;
        margin: 0;
        padding: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>
    var map;
    var marcadorDestino;
    var marcadorUsuario;

    var destino = {
        lat: -23.5596360,
        lng: -46.6593540
    };

    // Roda assim que a página carrega, criando o mapa
    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 15,
            center: destino,
        });

        // Marcador fixo de retirada (Game Center Paulista) - Vermelho
        marcadorDestino = new google.maps.Marker({
            position: destino,
            map: map,
            title: "Game Center Paulista",
            icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
        });
    }

    // Chamada pelo Java sempre que uma nova localização for capturada
    function updateLocation(lat, lng) {
        var origem = { lat: lat, lng: lng };

        map.setCenter(origem); // recentraliza o mapa
        map.setZoom(15);

        if (marcadorUsuario) {
            marcadorUsuario.setMap(null); // remove o marcador anterior
        }

        // Marcador da localização atual do usuário - Azul
        marcadorUsuario = new google.maps.Marker({
            position: origem,
            map: map,
            title: "Você está aqui",
            icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        });
    }
</script>

<script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBpCvxlvHSbCWjAOsM3mm-pLmjTpMN-9MM&callback=initMap"
        async defer>
</script>

</body>
</html>
